# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block.
id: "CMN-C2-280"
name: "RakusExpenseAgent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 2"
# ClassifyIntentNode's LLM path (Azure OpenAI) enhances the deterministic
# keyword classification below; the keyword heuristic is the baseline and
# ALWAYS remains available (any LLM failure degrades to it silently, never
# status=error) — see src/nodes/classify_intent_node.py.
generation_mode: "llm"  # deterministic | llm
industry: "CMN"

base_type: "ToolCallingAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
class: "src.graph.graph.RakusExpenseAgent"

required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — declare every ctx.secrets.require() key + constructed extra.
# AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT: all
# three resolved via ctx.secrets.require(...) inside ClassifyIntentNode.execute()
# (per-invocation, never cached). None of it lives in config/config.yaml —
# endpoint and deployment are secrets here, not runtime config, even though
# they are not credentials by themselves.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI
